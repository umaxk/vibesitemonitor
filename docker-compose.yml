version: "3.8"

services:
  monitor:
    build: .
    container_name: site-monitor
    ports:
      - "1485:1485"
    environment:
      - MONITOR_PASSWORD=${MONITOR_PASSWORD:?Set MONITOR_PASSWORD in .env}
    volumes:
      - ./config.json:/app/config.json
      - ./monitor.log:/app/monitor.log
    restart: unless-stopped
