<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMonitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="login-screen" class="login-screen hidden">
        <div class="login-box">
            <h1 id="login-title">VibeMonitor</h1>
            <p>Вход в панель мониторинга</p>
            <input type="text" id="username-input" placeholder="Логин" autocomplete="username" autofocus>
            <input type="password" id="password-input" placeholder="Пароль" autocomplete="current-password">
            <button id="login-btn">Войти</button>
            <p id="login-error" class="error hidden">Неверный логин или пароль</p>
        </div>
    </div>

    <div id="app" class="hidden">
        <header class="app-header">
            <h1 id="app-title" class="header-logo">VibeMonitor</h1>
            <div class="header-toolbar">
                <input type="search" id="search-input" class="search-input" placeholder="Поиск сайта...">
                <button id="filters-toggle" class="btn-ghost filters-toggle" title="Фильтры" aria-expanded="false">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M2 4h12M4.5 8h7M6.5 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
                <div id="filter-selects" class="filter-selects">
                    <select id="status-filter" class="select-input" title="Фильтр по статусу">
                        <option value="all">Все статусы</option>
                        <option value="up">Доступны</option>
                        <option value="down">Недоступны</option>
                        <option value="unknown">Без данных</option>
                        <option value="paused">На паузе</option>
                    </select>
                    <select id="tag-filter" class="select-input" title="Фильтр по тегу">
                        <option value="all">Все теги</option>
                    </select>
                    <select id="sort-select" class="select-input" title="Сортировка">
                        <option value="name">По имени</option>
                        <option value="status">По статусу</option>
                        <option value="latency">По задержке</option>
                    </select>
                </div>
            </div>
            <div class="header-controls">
                <button id="theme-btn" class="btn-ghost" title="Сменить тему">◐</button>
                <button id="settings-btn" class="btn-ghost settings-btn hidden" title="Настройки">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span class="btn-label">Настройки</span>
                </button>
                <div id="user-menu" class="user-menu hidden">
                    <button id="user-menu-btn" class="user-menu-btn" aria-expanded="false" title="Аккаунт">
                        <span id="user-avatar" class="user-avatar"></span>
                        <span id="user-badge" class="user-name"></span>
                        <span class="caret" aria-hidden="true">▾</span>
                    </button>
                    <div id="user-dropdown" class="user-dropdown hidden">
                        <div class="dropdown-info">
                            <span id="dropdown-name"></span>
                            <span id="dropdown-role" class="dropdown-role"></span>
                        </div>
                        <div class="dropdown-sep"></div>
                        <button id="logout-btn" class="dropdown-item" title="Выйти из текущей сессии">Выйти</button>
                        <button id="logout-all-btn" class="dropdown-item" title="Завершить все активные сессии">Выйти везде</button>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section id="sites-grid" class="sites-grid"></section>
        </main>

        <button id="add-site-btn" class="btn-icon add-site-fab hidden" title="Добавить сайт" aria-label="Добавить сайт">+</button>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button class="modal-close" data-close="settings-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab active" data-tab="general">Общие</button>
                    <button class="tab" data-tab="status">Статус-страница</button>
                    <button class="tab" data-tab="notifications">Уведомления</button>
                    <button class="tab" data-tab="users">Пользователи</button>
                </div>

                <div id="tab-general" class="tab-panel">
                    <div class="form-group">
                        <label>Название проекта</label>
                        <input type="text" id="project-name-input" maxlength="100">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Интервал проверки (сек)</label>
                            <input type="number" id="interval-input" min="5" max="3600">
                        </div>
                        <div class="form-group">
                            <label>Таймаут (сек)</label>
                            <input type="number" id="timeout-input" min="1" max="60">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Скрывать инцидент в карточке (часов)</label>
                            <input type="number" id="incident-hide-input" min="1" max="720">
                        </div>
                        <div class="form-group">
                            <label>SSL-проверка (часов)</label>
                            <input type="number" id="ssl-interval-input" min="1" max="168">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Хранить проверки (дней)</label>
                            <input type="number" id="retention-input" min="1" max="365">
                        </div>
                        <div class="form-group">
                            <label>Хранить инциденты (дней)</label>
                            <input type="number" id="incident-retention-input" min="7" max="730">
                        </div>
                    </div>
                    <button id="save-settings-btn" class="btn-primary">Сохранить</button>
                </div>

                <div id="tab-status" class="tab-panel hidden">
                    <div class="form-group checkbox-row">
                        <label><input type="checkbox" id="status-enabled-input"> Включить публичную страницу /status</label>
                    </div>
                    <div class="form-group">
                        <label>Заголовок</label>
                        <input type="text" id="status-title-input" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="status-description-input" maxlength="500" rows="3"></textarea>
                    </div>
                    <p class="hint">На странице показываются только сайты с включённым флагом «Публичный».</p>
                    <button id="save-status-btn" class="btn-primary">Сохранить</button>
                </div>

                <div id="tab-notifications" class="tab-panel hidden">
                    <p id="telegram-status" class="hint"></p>
                    <div class="inline-form">
                        <input type="text" id="recipient-chat-input" placeholder="chat_id, например 123456789">
                        <input type="text" id="recipient-label-input" placeholder="Подпись">
                        <button id="add-recipient-btn" class="btn-primary">Добавить</button>
                    </div>
                    <div id="recipients-list" class="list-block"></div>
                    <button id="test-notifications-btn" class="btn-secondary">Отправить тест</button>
                </div>

                <div id="tab-users" class="tab-panel hidden">
                    <div class="inline-form">
                        <input type="text" id="new-user-name" placeholder="Логин">
                        <input type="password" id="new-user-password" placeholder="Пароль (мин. 8)">
                        <select id="new-user-role">
                            <option value="viewer">viewer</option>
                            <option value="admin">admin</option>
                        </select>
                        <button id="add-user-btn" class="btn-primary">Добавить</button>
                    </div>
                    <div id="users-list" class="list-block"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="add-modal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 id="add-modal-title">Добавить сайт</h2>
                <button class="modal-close" data-close="add-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>URL *</label>
                    <input type="url" id="new-site-url" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="new-site-name" placeholder="Example" maxlength="200">
                </div>
                <div class="form-group">
                    <label>Интервал проверки (сек) — необязательно</label>
                    <input type="number" id="new-site-interval" min="5" max="3600" placeholder="По умолчанию">
                </div>
                <div class="form-group">
                    <label>Теги (через запятую)</label>
                    <input type="text" id="new-site-tags" placeholder="prod, api">
                </div>
                <div class="form-group checkbox-row">
                    <label><input type="checkbox" id="new-site-public"> Показывать на публичной статус-странице</label>
                </div>
                <button id="confirm-add-btn" class="btn-primary">Добавить</button>
            </div>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content modal-wide">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <div class="modal-header-actions">
                    <button id="edit-site-btn" class="modal-action-btn hidden">Редактировать</button>
                    <button class="modal-close" data-close="modal">&times;</button>
                </div>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="/static/vendor/chart.umd.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
